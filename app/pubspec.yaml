name: jotline
description: "Jotline: offline-first notebook and notes app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  hive_ce: ^2.20.2
  hive_ce_flutter: ^2.4.0
  uuid: ^4.6.0
  intl: ^0.20.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
