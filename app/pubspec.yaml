name: jotline
description: "Jotline: offline-first notebook and notes app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cupertino_icons: ^1.0.8
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  hive_ce: ^2.20.2
  hive_ce_flutter: ^2.4.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
