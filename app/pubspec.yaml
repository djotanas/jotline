name: jotline
description: "Jotline: offline-first notebook and notes app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  characters: ^1.4.1
  cupertino_icons: ^1.0.8
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  hive_ce: ^2.20.2
  hive_ce_flutter: ^2.4.0
  intl: ^0.20.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.5
  perfect_freehand: 2.5.2+1
  super_editor: 0.3.0-dev.52
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/schibsted_grotesk/OFL.txt
    - assets/fonts/literata/OFL.txt
    - assets/fonts/ibm_plex_mono/OFL.txt
  fonts:
    - family: Schibsted Grotesk
      fonts:
        - asset: assets/fonts/schibsted_grotesk/SchibstedGrotesk[wght].ttf
          weight: 400
        - asset: assets/fonts/schibsted_grotesk/SchibstedGrotesk[wght].ttf
          weight: 500
        - asset: assets/fonts/schibsted_grotesk/SchibstedGrotesk[wght].ttf
          weight: 600
        - asset: assets/fonts/schibsted_grotesk/SchibstedGrotesk[wght].ttf
          weight: 700
    - family: Literata
      fonts:
        - asset: assets/fonts/literata/Literata[opsz,wght].ttf
          weight: 400
        - asset: assets/fonts/literata/Literata-Italic[opsz,wght].ttf
          weight: 400
          style: italic
        - asset: assets/fonts/literata/Literata[opsz,wght].ttf
          weight: 500
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Medium.ttf
          weight: 500

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  image_path_ios: assets/icon/icon_ios.png
  remove_alpha_ios: true
  background_color_ios: "#1B1A17"
  adaptive_icon_background: "#1B1A17"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png

flutter_native_splash:
  color: "#F3F2EE"
  image: assets/icon/splash.png
  android_12:
    color: "#F3F2EE"
    image: assets/icon/splash_android12.png
  web: false
